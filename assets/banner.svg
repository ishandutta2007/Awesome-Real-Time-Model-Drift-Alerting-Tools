<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Drift Wave Gradient - Baseline -->
    <linearGradient id="baseline-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Drift Wave Gradient - Shifted / Alert -->
    <linearGradient id="drift-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#FB923C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS (Positioned safely away from center text) -->
  
  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="70" r="110" fill="#0284C7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="70;90;70" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="290" r="130" fill="#E11D48" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="290;270;290" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="20" r="80" fill="#10B981" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Top Real-Time Wave: Baseline vs Drift Shift -->
  <path d="M -50 75 Q 250 125 550 45 T 1250 65" fill="none" stroke="url(#baseline-wave)" stroke-width="2.5">
    <animate attributeName="d" values="M -50 75 Q 250 125 550 45 T 1250 65; M -50 60 Q 250 35 550 85 T 1250 50; M -50 75 Q 250 125 550 45 T 1250 65" dur="9s" repeatCount="indefinite" />
  </path>
  <path d="M -50 60 Q 300 20 650 90 T 1250 80" fill="none" stroke="url(#drift-wave)" stroke-width="2" stroke-dasharray="6,4">
    <animate attributeName="d" values="M -50 60 Q 300 20 650 90 T 1250 80; M -50 85 Q 300 110 650 40 T 1250 70; M -50 60 Q 300 20 650 90 T 1250 80" dur="11s" repeatCount="indefinite" />
  </path>

  <!-- Bottom Streaming Telemetry Wave -->
  <path d="M -50 295 Q 320 240 680 320 T 1250 280" fill="none" stroke="url(#baseline-wave)" stroke-width="2">
    <animate attributeName="d" values="M -50 295 Q 320 240 680 320 T 1250 280; M -50 275 Q 320 325 680 260 T 1250 305; M -50 295 Q 320 240 680 320 T 1250 280" dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M -50 310 Q 350 330 700 275 T 1250 315" fill="none" stroke="url(#drift-wave)" stroke-width="1.8" stroke-dasharray="4,4">
    <animate attributeName="d" values="M -50 310 Q 350 330 700 275 T 1250 315; M -50 285 Q 350 260 700 320 T 1250 280; M -50 310 Q 350 330 700 275 T 1250 315" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Pulsing Drift Detection & Alert Pings -->
  <g>
    <!-- Left Alert Ping -->
    <circle cx="210" cy="65" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3;9;3" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="65" r="14" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="8;20;8" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Right Drift Anomaly Ping -->
    <circle cx="1010" cy="70" r="4.5" fill="#F43F5E">
      <animate attributeName="r" values="3.5;10;3.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1010" cy="70" r="16" fill="none" stroke="#F43F5E" stroke-width="1.2" opacity="0.5">
      <animate attributeName="r" values="8;24;8" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Bottom Secondary Pings -->
    <circle cx="160" cy="295" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="305" r="3.5" fill="#FB923C">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Pristine Legibility & Contrast) -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Pill Badge -->
    <rect x="400" y="40" width="400" height="32" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4" filter="url(#soft-glow)" />
    <text x="600" y="61" font-size="12.5" font-weight="700" fill="#38BDF8" letter-spacing="1.5">⚡ REAL-TIME ML DRIFT &amp; OBSERVABILITY ⚡</text>

    <!-- Main Title -->
    <text x="600" y="148" font-size="40" font-weight="800" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Real-Time Model Drift Alerting Tools
    </text>

    <!-- Subtitle -->
    <text x="600" y="202" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="0.4">
      Production ML Monitoring 🤖 • Data Drift Detection 📊 • Concept Drift 📉 • Automated Alerting 🚨
    </text>

    <!-- Highlight Badges Row -->
    <g transform="translate(600, 260)">
      <!-- Item 1: Enterprise SaaS -->
      <rect x="-310" y="0" width="180" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="-220" y="23" font-size="13.5" font-weight="600" fill="#E2E8F0">🏢 Enterprise SaaS</text>

      <!-- Item 2: Open Source Stack -->
      <rect x="-95" y="0" width="190" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="23" font-size="13.5" font-weight="600" fill="#E2E8F0">💻 Open-Source Stack</text>

      <!-- Item 3: Real-Time Alerting -->
      <rect x="130" y="0" width="180" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="220" y="23" font-size="13.5" font-weight="600" fill="#E2E8F0">🚨 Real-Time Alerting</text>
    </g>
  </g>
</svg>
